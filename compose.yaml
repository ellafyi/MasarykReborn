services:
  masaryk.core:
    image: masaryk.core
    build:
      context: .
      dockerfile: Masaryk.Core/Dockerfile
    env_file:
      - .env
    networks:
      - postgres-network
  
  masaryk.db:
    image: 'postgres:18-trixie'
    ports:
      - "15432:5432"
    env_file:
      - .env
    networks:
      - postgres-network
    volumes:
      - ${PWD}/db-data/:/var/lib/postgresql/

networks:
  postgres-network:
    driver: bridge
