# Deploys a pushed tag. Run by hand on an older tag to roll back.
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy

permissions:
  contents: write

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin "$GITHUB_SHA:refs/heads/production"
      - run: curl --fail --silent --show-error --request POST "$PORTAINER_WEBHOOK"
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
